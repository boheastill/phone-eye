name: smoke
on: [push, pull_request]
jobs:
  stdio-tools-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: tools/list must expose the five verbs
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | timeout 20 python server.py > out.jsonl
          python3 - <<'PY'
          import json
          names = []
          for line in open('out.jsonl'):
              try: d = json.loads(line)
              except: continue
              if d.get('id') == 2:
                  names = sorted(t['name'] for t in d['result']['tools'])
          expected = sorted(['phone_look','phone_tap','phone_swipe','phone_type','phone_screenshot'])
          assert names == expected, f"{names} != {expected}"
          print('tools OK:', names)
          PY
